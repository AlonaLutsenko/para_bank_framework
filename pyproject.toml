[tool.black]
target-version = ["py311"]
skip-string-normalization = true
line-length = 120

[tool.isort]
profile = "black"
known_first_party = ["framework"]
multi_line_output = 3
include_trailing_comma = true

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203",
    "W503",
    "E501",
]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
]
