name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - &checkout
        uses: actions/checkout@v4

      - &setup_python
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check code formatting with Black
        run: black --check .

      - name: Check import sorting with isort
        run: isort --check-only .

      - name: Lint with flake8
        run: flake8 .

  pytest:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      selenium-hub:
        image: selenium/standalone-chrome:4.28.1
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g

    steps:
      - *checkout
      - *setup_python

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Selenium Hub
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://localhost:4444/wd/hub/status"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Selenium Hub did not become ready in time")
          PY

      - name: Run tests with coverage and Allure
        run: |
          pytest --browser=${{ env.BROWSER }} --headless --cov=framework --cov=ui --cov-report=xml --cov-report=term --alluredir=allure-results -v
        env:
          CI: "true"
          BROWSER: chrome
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            .pytest_cache/
            htmlcov/
            allure-results/
          retention-days: 7

