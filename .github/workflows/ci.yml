name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black/isort/flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Black (format check)
        run: black --check .

      - name: isort (import order check)
        run: isort --check-only .

      - name: flake8 (lint)
        run: flake8 .

  tests:
    name: Tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint

    services:
      selenium:
        image: selenium/standalone-chrome:4.28.1
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --health-cmd="curl -fsS http://localhost:4444/wd/hub/status || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-html

      - name: Run tests
        run: |
          mkdir -p reports
          pytest \
            --browser=chrome \
            --headless \
            --remote \
            --cov=framework \
            --cov=ui \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --junitxml=pytest-junit.xml \
            --html=reports/report.html \
            --alluredir=allure-results \
            -v
        env:
          CI: "true"
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
          PARABANK_USERNAME_DEFAULT: ${{ secrets.PARABANK_USERNAME_DEFAULT }}
          PARABANK_PASSWORD_DEFAULT: ${{ secrets.PARABANK_PASSWORD_DEFAULT }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v6
        with:
          name: pytest-html-report
          path: reports/report.html

      - name: Upload Allure results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
